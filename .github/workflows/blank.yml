
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android source files
        run: |
          mkdir -p app/src/main/java/de/rsho/daftarhisabati
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt app/src/main/java/de/rsho/daftarhisabati/MainActivity.kt
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-hisabati-apk
          path: app/build/outputs/apk/debug/app-debug.apk
